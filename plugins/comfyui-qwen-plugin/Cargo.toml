[package]
name = "comfyui-qwen-plugin"
version = "0.1.0"
edition = "2021"
description = "ComfyUI 图片生成与参考图编辑插件（文生图 + 1~16 张参考图编辑）"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plugin-interface = { path = "../../plugin-interface" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
actix-rt = "2.9"
